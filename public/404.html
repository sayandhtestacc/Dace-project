<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DUK Hub — Campus Service Platform</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages & Static Hosts
      // Redirects deep links to index.html with query parameter
      var pathSegmentsToKeep = 0;
      var l = window.location;
      // If repo name is in path, e.g. /Dace-project/, detect segments
      if (l.pathname.startsWith('/Dace-project')) {
        pathSegmentsToKeep = 1;
      }
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
